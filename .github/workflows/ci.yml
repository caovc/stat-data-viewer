name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  compile:
    name: Compile (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            clang \
            llvm-dev \
            libclang-dev

      - name: Install Windows LLVM (bindgen)
        if: runner.os == 'Windows'
        run: choco install llvm -y --no-progress

      - uses: dtolnay/rust-toolchain@1.88.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Frontend typecheck
        run: |
          npm ci
          npx vue-tsc --noEmit

      - name: Stub frontend dist for tauri-build
        run: |
          mkdir -p dist
          printf '%s\n' '<!doctype html><title>Stat Data Viewer</title>' > dist/index.html

      - name: Cargo check workspace
        env:
          LIBCLANG_PATH: ${{ runner.os == 'Windows' && 'C:\\Program Files\\LLVM\\bin' || '' }}
        run: cargo check --workspace
