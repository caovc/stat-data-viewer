name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  compile:
    name: Compile (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # windows-2022: DuckDB 1.2.2 does not compile on VS 2026 (windows-latest).
        os: [macos-latest, windows-2022, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            clang \
            llvm-dev \
            libclang-dev

      - name: Install macOS LLVM (bindgen)
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"

      - name: Install Windows LLVM (bindgen)
        if: runner.os == 'Windows'
        run: |
          choco install llvm -y --no-progress
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> "$env:GITHUB_ENV"
          echo "CXXFLAGS=/std:c++17 /EHsc" >> "$env:GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@1.88.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Frontend typecheck
        run: |
          npm ci
          npx vue-tsc --noEmit

      - name: Stub frontend dist for tauri-build
        run: |
          mkdir -p dist
          printf '%s\n' '<!doctype html><title>Stat Data Viewer</title>' > dist/index.html

      - name: Cargo check workspace
        run: cargo check --workspace
